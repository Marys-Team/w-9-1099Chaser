name: Deploy to WordPress.org

# ─────────────────────────────────────────────────────
# Ye workflow SIRF tab chalta hai jab koi version tag push ho
# (jaise v1.0.11). Normal commit ya PR merge par ye NAHI chalta.
# Manual run ke liye "workflow_dispatch" bhi diya hai (GitHub Actions
# tab par "Run workflow" button se chala sakte hain agar zaroorat ho).
# ─────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (example: 1.0.9)'
        required: true
        type: string

jobs:
  deploy-to-wordpress:
    name: Deploy Plugin to WordPress.org
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # STEP 1 — Repo ka code checkout karo
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # STEP 2 — Version number nikalo (tag se ya manual input se)
      - name: Get version number
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          VERSION=$(echo "$VERSION" | tr -cd '0-9.')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      # STEP 3 — Plugin files ko 2 files mein consistency check karo
      # (Ye safety check hai: agar PHP file aur readme.txt ka version
      # alag ho, to deploy yahin rok do — galti se purana/galat version
      # WordPress.org par nahi jana chahiye)
      - name: Verify version consistency
        run: |
          PHP_VERSION=$(grep -m1 "Version:" w9-1099-chaser.php | sed -E 's/.*Version:\s*//' | tr -d '\r')
          README_VERSION=$(grep -m1 "Stable tag:" readme.txt | sed -E 's/.*Stable tag:\s*//' | tr -d '\r')
          echo "PHP file version: $PHP_VERSION"
          echo "readme.txt version: $README_VERSION"
          if [[ "$PHP_VERSION" != "$README_VERSION" ]]; then
            echo "ERROR: Version mismatch between w9-1099-chaser.php ($PHP_VERSION) and readme.txt ($README_VERSION)"
            exit 1
          fi
          echo "Versions match: $PHP_VERSION"

      # STEP 4 — Plugin ka clean ZIP build folder banao
      # NOTE: build folder ka naam "build-wp" hai — aage ke step mein
      # bhi yehi naam use hoga (purani file mein "build" aur "build-wp"
      # mismatch tha, yahan fix kar diya hai)
      - name: Create ZIP
        run: |
          mkdir -p build-wp
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build-wp' \
            --exclude='*.zip' \
            --exclude='node_modules' \
            ./ build-wp/
          cd build-wp
          zip -r ../w9-1099-chaser-${{ steps.version.outputs.version }}.zip .

      # STEP 5 — GitHub par Release page banao (ZIP attach hoga)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          files: w9-1099-chaser-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # STEP 6 — WordPress.org SVN par deploy karo
      # NOTE: yahan "build-wp/" se sync ho raha hai — pehle "build/" likha
      # hua tha jo galat tha kyunke upar wala folder "build-wp" banaya gaya tha.
      - name: Deploy to WordPress.org via SVN
        run: |
          SVN_URL="https://plugins.svn.wordpress.org/w9-1099-chaser"
          SVN_DIR="/tmp/svn-w9-1099-chaser"

          svn checkout --depth immediates "$SVN_URL" "$SVN_DIR" \
            --username "${{ secrets.WPORG_USERNAME }}" \
            --password "${{ secrets.WPORG_PASSWORD }}" \
            --non-interactive --no-auth-cache

          svn update --set-depth infinity "$SVN_DIR/trunk" \
            --username "${{ secrets.WPORG_USERNAME }}" \
            --password "${{ secrets.WPORG_PASSWORD }}" \
            --non-interactive --no-auth-cache

          rsync -av --delete \
            --exclude='.svn' \
            build-wp/ "$SVN_DIR/trunk/"

          cd "$SVN_DIR"
          svn add --force trunk
          svn status | grep '^!' | awk '{print $2}' | xargs -r svn delete

          svn commit -m "Deploy version ${{ steps.version.outputs.version }}" \
            --username "${{ secrets.WPORG_USERNAME }}" \
            --password "${{ secrets.WPORG_PASSWORD }}" \
            --non-interactive --no-auth-cache

      # STEP 7 — Confirm message
      - name: Deployment complete
        run: |
          echo "Version ${{ steps.version.outputs.version }} deployed to WordPress.org"
          echo "GitHub Release v${{ steps.version.outputs.version }} created"
