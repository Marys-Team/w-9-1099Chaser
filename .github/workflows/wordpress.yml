name: Deploy to WordPress.org

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (example: 1.0.9)'
        required: true
        type: string

jobs:

  deploy-to-wordpress:
    name: Deploy Plugin to WordPress.org
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Get version number
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -i "^ \* Version:" w9-1099-chaser.php | head -1 | cut -d: -f2 | xargs)
          fi
          VERSION=$(echo "$VERSION" | tr -cd '0-9.')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Create and push tag
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG created"
          else
            echo "Tag $TAG already exists, skipping"
          fi

      - name: Create ZIP
        run: |
          mkdir -p build-wp
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build-wp' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build-wp/
          cd build-wp
          zip -r ../w9-1099-chaser-${{ steps.version.outputs.version }}.zip .
          echo "ZIP created"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          body: |
            ## Release v${{ steps.version.outputs.version }}
            - ✅ WordPress.org build
            - 🔗 https://wordpress.org/plugins/w9-1099-chaser/
          files: w9-1099-chaser-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build directory
        run: |
          mkdir -p build
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build/

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Deploy to WordPress.org via SVN
        run: |
          SVN_URL="https://plugins.svn.wordpress.org/w9-1099-chaser"
          SVN_DIR="/tmp/svn-w9-1099-chaser"
          MAX_ATTEMPTS=3
          ATTEMPT=0
          until svn checkout --depth immediates "$SVN_URL" "$SVN_DIR" --username "${{ secrets.WPORG_USERNAME }}" --password "${{ secrets.WPORG_PASSWORD }}" --non-interactive --no-auth-cache; do
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "SVN checkout failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Attempt $ATTEMPT failed, retrying in 30s..."
            sleep 30
          done
          svn update --set-depth infinity "$SVN_DIR/trunk" --username "${{ secrets.WPORG_USERNAME }}" --password "${{ secrets.WPORG_PASSWORD }}" --non-interactive --no-auth-cache
          rsync -av --delete ${{ github.workspace }}/build/ "$SVN_DIR/trunk/"
          cd "$SVN_DIR"
          svn add --force trunk
          svn status | grep '^!' | awk '{print $2}' | xargs -r svn delete
          svn commit -m "Deploy version ${{ steps.version.outputs.version }}" --username "${{ secrets.WPORG_USERNAME }}" --password "${{ secrets.WPORG_PASSWORD }}" --non-interactive --no-auth-cache
          echo "✅ Deployed to WordPress.org trunk"

      - name: Deployment success
        run: |
          echo "Plugin deployed to WordPress.org"
          echo "View at: https://wordpress.org/plugins/w9-1099-chaser/"
