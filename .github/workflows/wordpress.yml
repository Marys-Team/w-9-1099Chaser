name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (example: 1.0.9)'
        required: true
        type: string

jobs:
  deploy-to-wordpress:
    name: Deploy Plugin to WordPress.org
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version number
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          VERSION=$(echo "$VERSION" | tr -cd '0-9.')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Verify version consistency
        run: |
          PHP_VERSION=$(grep -m1 "Version:" w9-1099-chaser.php | sed -E 's/.*Version:\s*//' | tr -d '\r')
          README_VERSION=$(grep -m1 "Stable tag:" readme.txt | sed -E 's/.*Stable tag:\s*//' | tr -d '\r')
          echo "PHP file version: $PHP_VERSION"
          echo "readme.txt version: $README_VERSION"
          if [[ "$PHP_VERSION" != "$README_VERSION" ]]; then
            echo "ERROR: Version mismatch between w9-1099-chaser.php ($PHP_VERSION) and readme.txt ($README_VERSION)"
            exit 1
          fi
          echo "Versions match: $PHP_VERSION"

      - name: Create ZIP
        run: |
          mkdir -p build-wp
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build-wp' \
            --exclude='build' \
            --exclude='*.zip' \
            --exclude='node_modules' \
            ./ build-wp/
          cd build-wp
          zip -r ../w9-1099-chaser-${{ steps.version.outputs.version }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          body: |
            ## Release v${{ steps.version.outputs.version }}
            - WordPress.org build
            - https://wordpress.org/plugins/w9-1099-chaser/
          files: w9-1099-chaser-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build directory
        run: |
          mkdir -p build
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='build-wp' \
            --exclude='*.zip' \
            --exclude='node_modules' \
            ./ build/

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          SLUG: w9-1099-chaser
          BUILD_DIR: ./build
          VERSION: ${{ steps.version.outputs.version }}
          GENERATE_ZIP: false

      - name: Deployment success
        run: |
          echo "Version ${{ steps.version.outputs.version }} deployed to WordPress.org"
          echo "GitHub Release v${{ steps.version.outputs.version }} created"
          echo "View at: https://wordpress.org/plugins/w9-1099-chaser/"
